<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto-evaluación — Portafolio Teo Visuals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070d;
      --surface: #0e0e18;
      --card: #14141f;
      --card-2: #1a1a28;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.15);
      --text: #ececf2;
      --muted: #7a7a90;
      --keep: #00e676;
      --tweak: #ffd32a;
      --drop: #ff5263;
      --accent: #8a5cff;
      --accent2: #00d4ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }
    a { color: inherit; }

    /* ─── Top header ─── */
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7,7,13,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .top h1 {
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.06em;
    }
    .top h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-stats {
      display: flex;
      gap: 1rem;
      margin-left: auto;
      align-items: center;
    }
    .tstat {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.keep { background: var(--keep); }
    .dot.tweak { background: var(--tweak); }
    .dot.drop { background: var(--drop); }

    .brief-btn {
      padding: 0.6rem 1.3rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .brief-btn:hover { opacity: 0.9; }

    .intro {
      max-width: 900px;
      margin: 2.5rem auto 0;
      padding: 0 2rem;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.92rem;
    }
    .intro strong { color: var(--text); font-weight: 500; }

    /* ─── Sections list ─── */
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 2rem 8rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .sec {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .sec.v-keep { border-color: rgba(0,230,118,0.35); }
    .sec.v-tweak { border-color: rgba(255,211,42,0.3); }
    .sec.v-drop { border-color: rgba(255,82,99,0.25); }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 1.4rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .sec-meta {}
    .sec-num {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .sec-name {
      font-family: 'Anton', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .verdicts {
      display: flex;
      gap: 0.35rem;
    }
    .vbtn {
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .vbtn:hover { border-color: var(--border-strong); color: var(--text); }
    .vbtn.keep.on { background: rgba(0,230,118,0.13); border-color: var(--keep); color: var(--keep); }
    .vbtn.tweak.on { background: rgba(255,211,42,0.12); border-color: var(--tweak); color: var(--tweak); }
    .vbtn.drop.on { background: rgba(255,82,99,0.12); border-color: var(--drop); color: var(--drop); }

    .sec-img {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      object-position: top;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #000;
      cursor: zoom-in;
    }

    .sec-body { padding: 1rem 1.4rem 1.3rem; }
    .sec-note {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      resize: vertical;
      min-height: 52px;
      outline: none;
      transition: border-color 0.15s;
    }
    .sec-note:focus { border-color: var(--accent); }
    .sec-note::placeholder { color: var(--muted); }

    /* ─── Brief modal ─── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      max-width: 760px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-h {
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-h h2 { font-family: 'Anton', sans-serif; font-size: 1.05rem; letter-spacing: 0.05em; }
    .x {
      background: transparent; border: none; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; width: 32px; height: 32px;
      border-radius: 50%; transition: all 0.15s;
    }
    .x:hover { background: var(--card); color: var(--text); }
    .modal-c { padding: 1.4rem; overflow-y: auto; }
    .brief-text {
      width: 100%;
      min-height: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 1rem 1.2rem;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .modal-a {
      padding: 1rem 1.4rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .mbtn {
      padding: 0.6rem 1.2rem; border-radius: 8px;
      border: 1px solid var(--border-strong); background: transparent;
      color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .mbtn:hover { background: var(--card); }
    .mbtn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff; font-weight: 600;
    }

    /* ─── Lightbox ─── */
    .lb {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 200;
      align-items: center; justify-content: center;
      cursor: zoom-out; padding: 1.5rem;
    }
    .lb.open { display: flex; }
    .lb img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card); border: 1px solid var(--border-strong);
      padding: 0.65rem 1.25rem; border-radius: 999px; font-size: 0.82rem;
      opacity: 0; transition: all 0.3s; z-index: 300; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
  </style>
</head>
<body>

<div class="top">
  <h1>AUTO-EVALUACIÓN <span>· MI PORTAFOLIO</span></h1>
  <div class="top-stats">
    <div class="tstat"><span class="dot keep"></span><span id="n-keep">0</span></div>
    <div class="tstat"><span class="dot tweak"></span><span id="n-tweak">0</span></div>
    <div class="tstat"><span class="dot drop"></span><span id="n-drop">0</span></div>
    <button class="brief-btn" onclick="openBrief()">📄 Generar feedback</button>
  </div>
</div>

<p class="intro">
  Revisa cada sección de <strong>tu propio portafolio</strong> y marca qué <strong>conservar</strong>,
  qué <strong>ajustar</strong> y qué <strong>eliminar</strong>. Añade notas con lo que quieres cambiar.
  Al final genera el feedback y pásamelo para refinar el sitio.
</p>

<div class="wrap" id="wrap"></div>

<!-- Brief modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-h">
      <h2>📄 FEEDBACK PARA REFINAR</h2>
      <button class="x" onclick="closeBrief()">✕</button>
    </div>
    <div class="modal-c">
      <textarea class="brief-text" id="briefText" readonly></textarea>
    </div>
    <div class="modal-a">
      <button class="mbtn" onclick="closeBrief()">Cerrar</button>
      <button class="mbtn primary" onclick="copyBrief()">📋 Copiar</button>
    </div>
  </div>
</div>

<div class="lb" id="lb" onclick="this.classList.remove('open')">
  <img id="lbImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
const SECTIONS = [
  { id: 'hero',     name: 'Hero',              img: 'feedback-shots/hero.png',     desc: 'Portada cinematográfica: "TEO VISUALS" sobre fondo oscuro, tagline y nav.' },
  { id: 'clientes', name: '+100 Clientes',     img: 'feedback-shots/clientes.png', desc: 'Marquee infinito con los 7 logos reales. "Han confiado en nosotros desde 2022".' },
  { id: 'trabajos', name: 'Proyecto destacado', img: 'feedback-shots/trabajos.png', desc: 'Video destacado (Alemautos × Pajón) + botón "Explora el portafolio completo".' },
  { id: 'contacto', name: 'Contacto + Footer', img: 'feedback-shots/contacto.png', desc: 'CTA a pantalla completa, tachado diagonal, redes IG+YT, brand mark gigante.' },
];

const KEY = 'teo-self-feedback-v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function get(id) { return state[id] || { verdict: null, note: '' }; }
function set(id, patch) { state[id] = { ...get(id), ...patch }; save(); render(); stats(); }

const wrap = document.getElementById('wrap');
function render() {
  wrap.innerHTML = SECTIONS.map((s, i) => {
    const st = get(s.id);
    return `
      <div class="sec v-${st.verdict || 'none'}">
        <div class="sec-head">
          <div class="sec-meta">
            <div class="sec-num">Sección ${String(i+1).padStart(2,'0')}</div>
            <div class="sec-name">${s.name}</div>
          </div>
          <div class="verdicts">
            <button class="vbtn keep ${st.verdict==='keep'?'on':''}" onclick="setV('${s.id}','keep')">✓ Conservar</button>
            <button class="vbtn tweak ${st.verdict==='tweak'?'on':''}" onclick="setV('${s.id}','tweak')">~ Ajustar</button>
            <button class="vbtn drop ${st.verdict==='drop'?'on':''}" onclick="setV('${s.id}','drop')">✕ Eliminar</button>
          </div>
        </div>
        <img class="sec-img" src="${s.img}" alt="${s.name}" loading="lazy" onclick="zoom('${s.img}')">
        <div class="sec-body">
          <textarea class="sec-note" placeholder="¿Qué cambiarías de esta sección? Sé específico…"
            oninput="setNote('${s.id}', this.value)">${esc(st.note)}</textarea>
        </div>
      </div>`;
  }).join('');
}

function setV(id, v) {
  const cur = get(id).verdict;
  set(id, { verdict: cur === v ? null : v });
}
let noteTimers = {};
function setNote(id, val) {
  // debounce-free but avoid full re-render on each keystroke
  state[id] = { ...get(id), note: val };
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(save, 300);
}

function stats() {
  let k=0,t=0,d=0;
  Object.values(state).forEach(s => {
    if (s.verdict==='keep') k++; else if (s.verdict==='tweak') t++; else if (s.verdict==='drop') d++;
  });
  document.getElementById('n-keep').textContent = k;
  document.getElementById('n-tweak').textContent = t;
  document.getElementById('n-drop').textContent = d;
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function zoom(src){ document.getElementById('lbImg').src = src; document.getElementById('lb').classList.add('open'); }

/* ─── Brief ─── */
function openBrief() {
  document.getElementById('briefText').value = buildBrief();
  document.getElementById('modal').classList.add('open');
}
function closeBrief(){ document.getElementById('modal').classList.remove('open'); }
function copyBrief() {
  const t = document.getElementById('briefText');
  t.select();
  navigator.clipboard.writeText(t.value).then(() => showToast('Copiado ✓'));
}

function buildBrief() {
  const L = [];
  L.push('FEEDBACK — REFINAR MI PORTAFOLIO');
  L.push('='.repeat(45));
  L.push('');
  L.push(`Fecha: ${new Date().toLocaleDateString('es-CO',{dateStyle:'long'})}`);
  L.push('');

  const keep=[], tweak=[], drop=[];
  SECTIONS.forEach(s => {
    const st = state[s.id];
    if (!st || !st.verdict) return;
    const note = st.note ? ` — ${st.note.trim()}` : '';
    const line = `${s.name}${note}`;
    if (st.verdict==='keep') keep.push(line);
    else if (st.verdict==='tweak') tweak.push(line);
    else if (st.verdict==='drop') drop.push(line);
  });

  if (keep.length){ L.push('━━ ✓ CONSERVAR (me gusta así) ━━'); keep.forEach(l=>L.push('  • '+l)); L.push(''); }
  if (tweak.length){ L.push('━━ ~ AJUSTAR (cambiar esto) ━━'); tweak.forEach(l=>L.push('  • '+l)); L.push(''); }
  if (drop.length){ L.push('━━ ✕ ELIMINAR ━━'); drop.forEach(l=>L.push('  • '+l)); L.push(''); }

  // sections with notes but no verdict
  const orphan = SECTIONS.filter(s => { const st=state[s.id]; return st && st.note && !st.verdict; });
  if (orphan.length){ L.push('━━ NOTAS SUELTAS ━━'); orphan.forEach(s=>L.push(`  • ${s.name} — ${state[s.id].note.trim()}`)); L.push(''); }

  if (!keep.length && !tweak.length && !drop.length && !orphan.length) {
    L.push('(Aún no has evaluado ninguna sección.)'); L.push('');
  }

  L.push('━━ INSTRUCCIONES PARA CLAUDE ━━');
  L.push('');
  L.push('Aplica este feedback a mi portafolio:');
  L.push('- CONSERVAR: no toques estas secciones');
  L.push('- AJUSTAR: haz los cambios indicados en las notas');
  L.push('- ELIMINAR: quita estas secciones del sitio');
  L.push('- Mantén la estética cinematográfica oscura y el español');
  return L.join('\n');
}

let tT;
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2000); }

document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ closeBrief(); document.getElementById('lb').classList.remove('open'); }
});

render(); stats();
</script>
</body>
</html>
