<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos — Teo Visuals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#000; --text:#fff; --muted:#8a8a8a;
      --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.18);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    a { color:inherit; text-decoration:none; }

    nav {
      position:fixed; top:0; left:0; right:0; z-index:100; padding:1.5rem 2.5rem;
      display:flex; justify-content:space-between; align-items:center;
      background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); transition:background 0.3s;
    }
    nav.scrolled { background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
    .logo { font-family:'Anton',sans-serif; font-size:1.4rem; letter-spacing:0.12em; line-height:1; }
    .logo span { opacity:0.5; }
    .nav-back { font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.85; transition:opacity 0.2s; }
    .nav-back:hover { opacity:1; }

    header.head { padding:9rem 2.5rem 2.5rem; max-width:1500px; margin:0 auto; }
    .head-eyebrow { font-size:0.78rem; letter-spacing:0.3em; text-transform:uppercase; opacity:0.5; margin-bottom:1.25rem; }
    h1.head-title { font-family:'Anton',sans-serif; font-size:clamp(2.8rem,9vw,7rem); letter-spacing:0.02em; line-height:0.95; }
    h1.head-title span { color:rgba(255,255,255,0.3); }
    .head-sub { margin-top:1.25rem; max-width:540px; color:var(--muted); font-size:1rem; line-height:1.7; }

    .filters {
      max-width:1500px; margin:0 auto; padding:1rem 2.5rem 2rem; display:flex; gap:0.5rem; flex-wrap:wrap;
      position:sticky; top:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); z-index:50; border-bottom:1px solid var(--line);
    }
    .fbtn {
      padding:0.45rem 1.1rem; border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:#fff;
      font-family:inherit; font-size:0.72rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; opacity:0.65; transition:all 0.2s;
    }
    .fbtn:hover { opacity:1; border-color:#fff; }
    .fbtn.active { background:#fff; color:#000; opacity:1; border-color:#fff; }

    .grid { max-width:1500px; margin:2rem auto; padding:0 2.5rem 6rem; columns:3; column-gap:1rem; }
    @media (max-width:1000px){ .grid { columns:2; } }
    @media (max-width:600px){ .grid { columns:1; } }

    .card { break-inside:avoid; margin-bottom:1rem; position:relative; border-radius:10px; overflow:hidden; background:#0c0c0c; cursor:pointer; opacity:0; transform:translateY(20px); transition:opacity 0.6s ease, transform 0.6s ease; }
    .card.in { opacity:1; transform:translateY(0); }
    .card.hidden { display:none; }
    .media { position:relative; width:100%; display:block; background:#111; }
    .media video { width:100%; height:100%; object-fit:cover; display:block; }
    .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(to top, rgba(0,0,0,0.35), rgba(0,0,0,0.05)); opacity:0; transition:opacity 0.3s; pointer-events:none; }
    .card:hover .play { opacity:1; }
    .play .circle { width:52px; height:52px; border-radius:50%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.55); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .play svg { width:18px; height:18px; margin-left:3px; fill:#fff; }

    .lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:1000; align-items:center; justify-content:center; padding:1.5rem; cursor:zoom-out; }
    .lb.open { display:flex; }
    .lb video { max-width:92vw; max-height:90vh; border-radius:8px; box-shadow:0 0 80px rgba(0,0,0,0.7); }

    footer { border-top:1px solid var(--line); padding:2rem 2.5rem; display:flex; justify-content:space-between; font-size:0.75rem; letter-spacing:0.1em; opacity:0.5; flex-wrap:wrap; gap:1rem; }
    footer span { text-transform:uppercase; }
    @media (max-width:768px){ nav{padding:1.2rem 1.5rem;} header.head{padding:7rem 1.5rem 2rem;} .filters{padding:1rem 1.5rem 1.5rem;} .grid{padding:0 1.5rem 4rem;} }
  </style>
</head>
<body>

<nav id="nav">
  <a href="index.html" class="logo">TEO <span>VISUALS</span></a>
  <a href="index.html" class="nav-back">← Volver al inicio</a>
</nav>

<header class="head">
  <div class="head-eyebrow">— Portafolio completo</div>
  <h1 class="head-title">PROYECTOS</h1>
  <p class="head-sub">Reels, fashion films y contenido para marcas. Producido desde Medellín.</p>
</header>

<div class="filters" id="filters">
  <button class="fbtn active" data-f="all">Todos</button>
  <button class="fbtn" data-f="automotriz">Automotriz</button>
  <button class="fbtn" data-f="marca">Marca</button>
  <button class="fbtn" data-f="corporativo">Corporativo</button>
  <button class="fbtn" data-f="eventos">Eventos</button>
</div>

<div class="grid" id="grid"></div>

<footer>
  <span>© 2026 Teo Visuals</span>
  <span>Medellín, Colombia</span>
</footer>

<div class="lb" id="lb"><video id="lbVid" controls playsinline></video></div>

<script>
  const WORKS = [
    { cat:'automotriz',  o:'horizontal', v:'assets/videos/AlemautosXAndresPajon V4.mp4', p:'assets/posters/AlemautosXAndresPajon V4.jpg' },
    { cat:'corporativo', o:'horizontal', v:'assets/videos/Alemautos Institucional.mp4', p:'assets/posters/Alemautos Institucional.jpg' },
    { cat:'eventos',     o:'horizontal', v:'assets/videos/Jumbo Stars 2024.mp4', p:'assets/posters/Jumbo Stars 2024.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Defender V6.mp4', p:'assets/posters/Defender V6.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Entrega G580 V5.mp4', p:'assets/posters/Entrega G580 V5.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Entrega RR West V2.mp4', p:'assets/posters/Entrega RR West V2.jpg' },
    { cat:'automotriz',  o:'horizontal', v:'assets/videos/Poblautos Blindaje_2.mp4', p:'assets/posters/Poblautos Blindaje_2.jpg' },
    { cat:'eventos',     o:'vertical',   v:'assets/videos/Jueves recap artistas, personas.mp4', p:'assets/posters/Jueves recap artistas, personas.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/GT3 x 458 V2.mp4', p:'assets/posters/GT3 x 458 V2.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Copia de 128ti Built V1.mp4', p:'assets/posters/Copia de 128ti Built V1.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Smart PR x Night V3.mp4', p:'assets/posters/Smart PR x Night V3.jpg' },
    { cat:'marca',       o:'vertical',   v:'assets/videos/Cerrovento V2.mp4', p:'assets/posters/Cerrovento V2.jpg' },
    { cat:'marca',       o:'horizontal', v:'assets/videos/Podium V2.mp4', p:'assets/posters/Podium V2.jpg' },
    { cat:'corporativo', o:'horizontal', v:'assets/videos/Emprestur Corporate_3.mp4', p:'assets/posters/Emprestur Corporate_3.jpg' },
    { cat:'corporativo', o:'vertical',   v:'assets/videos/Guia Colinas de Paimado V3.mp4', p:'assets/posters/Guia Colinas de Paimado V3.jpg' },
    { cat:'eventos',     o:'vertical',   v:'assets/videos/La Solar 2024 V4.mp4', p:'assets/posters/La Solar 2024 V4.jpg' },
    { cat:'automotriz',  o:'vertical',   v:'assets/videos/Smart pilot assist V2.mp4', p:'assets/posters/Smart pilot assist V2.jpg' },
    { cat:'corporativo', o:'vertical',   v:'assets/videos/Credito V1.mp4', p:'assets/posters/Credito V1.jpg' },
  ];
  const RATIO = { vertical:'9 / 16', horizontal:'16 / 9' };
  const grid = document.getElementById('grid');
  WORKS.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.cat = t.cat;
    card.innerHTML = `
      <div class="media" style="aspect-ratio:${RATIO[t.o]}">
        <video src="${t.v}" poster="${t.p}" muted loop playsinline preload="none"></video>
        <div class="play"><div class="circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
      </div>`;
    const vid = card.querySelector('video');
    card.addEventListener('mouseenter', () => vid.play().catch(()=>{}));
    card.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });
    card.addEventListener('click', () => openLb(t.v, t.p));
    grid.appendChild(card);
  });

  document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const f = b.dataset.f;
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', !(f==='all' || c.dataset.cat===f)));
  }));

  const lb = document.getElementById('lb'), lbVid = document.getElementById('lbVid');
  function openLb(src, poster){ lbVid.src=src; lbVid.poster=poster; lb.classList.add('open'); lbVid.play().catch(()=>{}); document.body.style.overflow='hidden'; }
  lb.addEventListener('click', () => { lb.classList.remove('open'); lbVid.pause(); lbVid.removeAttribute('src'); lbVid.load(); document.body.style.overflow=''; });
  document.addEventListener('keydown', e => { if(e.key==='Escape' && lb.classList.contains('open')) lb.click(); });

  window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', window.scrollY>50));
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), { threshold:0.08 });
  document.querySelectorAll('.card').forEach(c => io.observe(c));
</script>
</body>
</html>
